name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    # Workflow réutilisable officiel de Home Assistant.
    uses: home-assistant/actions/hassfest/.github/workflows/hassfest.yml@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
